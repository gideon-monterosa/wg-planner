[tools]
node = "24"
"npm:cf" = "0.15.0"

[tasks.dev]
description = "Run the app locally (Vite + Worker + local D1)"
run = "cf dev"

[tasks.test]
run = ["npx vitest run --config vitest.config.ts", "npx vitest run --config vitest.worker.config.ts"]

[tasks.typecheck]
run = ["cf workers types", "npx tsc -b"]

[tasks.deploy]
depends = ["test"]
run = "cf deploy"

[tasks."db:migrate"]
description = "Apply D1 migrations to the local database that `cf dev` serves (ID matches LOCAL_D1_ID in cloudflare.config.ts)"
run = "cf d1 migrations apply 3f2a9c1e-7b4d-4e8a-9c6b-1d2e3f4a5b6c --local --persist-to .wrangler/state"

[tasks."db:migrate:remote"]
description = "Apply D1 migrations to the production database (set D1_DATABASE_ID)"
run = 'cf d1 migrations apply "${D1_DATABASE_ID:?set D1_DATABASE_ID to the wg-planner database ID}" --remote'
