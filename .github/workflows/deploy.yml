name: Deploy

# Pull requests: checks only. Push to main: deploy to integration.
# Tag vX.Y.Z (from `mise run release -- X.Y.Z`): deploy to production.
# Environment names, Worker names and D1 IDs live in environments.json.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: mise run test
      - run: mise run typecheck
      - run: cf build --mode integration
      - name: Deploy dry run (no credentials)
        run: cf deploy --prebuilt --no-provision --mode integration --dry-run

  deploy-integration:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-integration
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: cf build --mode integration
      - name: Apply D1 migrations (integration)
        run: mise run db:migrate:int
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy (integration)
        run: cf deploy --prebuilt --no-provision --mode integration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Only commits on main can be released to production."
            exit 1
          fi
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: cf build --mode production
      - name: Apply D1 migrations (production)
        run: mise run db:migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy (production)
        run: cf deploy --prebuilt --no-provision --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
